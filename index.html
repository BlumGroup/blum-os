<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<title>BLÜM OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1714; --ink2:#24201C; --ink3:#2F2A25; --cream:#F5F0E8; --cream2:#EDE8DC; --paper:#FFFDF8;
  --sage:#5C7A5E; --sage-l:#E3EEE3; --terra:#C4622D; --terra-l:#F7E3D8;
  --gold:#B8960C; --gold-l:#F5ECC4; --red:#B42318; --red-l:#FDE8E7;
  --line:rgba(26,23,20,.12); --muted:rgba(26,23,20,.56); --side:256px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}
svg.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Menú lateral ── */
aside{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--ink);color:rgba(255,255,255,.78);display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.marca{padding:22px 22px 18px;font-family:'DM Serif Display',serif;font-size:1.6rem;color:#fff;letter-spacing:.01em}
.marca em{color:var(--gold);font-style:italic}
.marca small{display:block;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:2px}
.menu{flex:1;overflow-y:auto;padding:4px 10px 16px}
.menu::-webkit-scrollbar{width:4px}.menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.sec{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:18px 12px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:.92rem;position:relative}
.item:hover{background:var(--ink2);color:#fff}
.item.on{background:var(--ink3);color:#fff;font-weight:600}
.item.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.item .pr{margin-left:auto;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);padding:1px 5px;border-radius:4px}
.item .num{margin-left:auto;background:var(--terra);color:#fff;border-radius:10px;font-size:.68rem;padding:1px 7px;font-weight:600}
.perfil{border-top:1px solid rgba(255,255,255,.08);padding:14px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;flex-shrink:0}
.perfil .n{color:#fff;font-weight:600;font-size:.88rem}.perfil .r{font-size:.74rem;color:rgba(255,255,255,.45)}
.perfil button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);border-radius:6px;padding:5px 9px;font-size:.74rem;cursor:pointer}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}

/* ── Contenido ── */
.contenido{margin-left:var(--side);min-height:100vh}
.barra{position:sticky;top:0;z-index:20;background:rgba(245,240,232,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.barra h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.35rem}
.hamb{display:none;background:none;border:none;cursor:pointer;padding:6px;margin-left:-6px}
.barra .acc{margin-left:auto;display:flex;gap:8px}
main{padding:24px 28px 60px;max-width:1120px}

/* ── Piezas ── */
.eti{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.saludo{font-family:'DM Serif Display',serif;font-size:1.9rem;line-height:1.1}
.saludo em{color:var(--terra);font-style:normal}
.fecha{color:var(--muted);margin:4px 0 22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:.95rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:default}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--ink)}
.kpi .v{font-family:'DM Serif Display',serif;font-size:1.9rem;line-height:1;margin-top:8px}
.kpi .h{font-size:.76rem;color:var(--muted);margin-top:4px}
.rejilla{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.tabla{width:100%;border-collapse:collapse;font-size:.86rem}
.tabla th{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:500}
.tabla td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tabla tr:last-child td{border-bottom:none}
.num-r{text-align:right;font-family:'DM Mono',monospace;white-space:nowrap}
.verde{color:var(--sage)}.terra{color:var(--terra)}
.vence{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem;gap:8px}
.vence:last-child{border-bottom:none}
.dias{font-family:'DM Mono',monospace;font-size:.68rem;padding:2px 8px;border-radius:4px;background:var(--gold-l);color:#7a6206;white-space:nowrap}
.dias.hoy{background:var(--red-l);color:var(--red)}
.pestanas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.pestanas button{background:none;border:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.pestanas button.on{color:var(--ink);border-color:var(--ink)}
.angosto{max-width:640px}

/* Formularios */
label{display:block;font-weight:600;font-size:.84rem;margin:12px 0 6px}
label .h{font-weight:400;color:var(--muted);font-size:.76rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sage)}
textarea{min-height:70px;resize:vertical}
.fila{display:flex;gap:10px}.fila>*{flex:1;min-width:0}
.valor{font-family:'DM Mono',monospace;font-size:1.25rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:10px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:500;font-size:.88rem}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bloque{margin-bottom:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:#fff}
.drop.req{border-color:var(--terra);color:var(--terra)}
.archivos{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.arch{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:8px;padding:8px}
.arch img,.arch .ico{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:.62rem;flex-shrink:0}
.arch .nom{flex:1;min-width:0;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch select{width:auto;padding:6px 8px;font-size:.8rem}
.arch .x{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--muted);padding:4px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:none;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
.btn.ancho{width:100%;margin-top:16px;padding:14px}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.chico{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn.verde{background:var(--sage)}
.btn.rojo{background:#fff;color:var(--red);border:1px solid var(--red)}

/* Listas */
.mov{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.mov .cuerpo{flex:1;min-width:0}
.mov .t1{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem}
.mov .t2{font-size:.78rem;color:var(--muted);margin-top:3px}
.mov .monto{font-family:'DM Mono',monospace;white-space:nowrap}
.mov .monto.in{color:var(--sage)}.mov .monto.out{color:var(--terra)}
.mov .obs{margin-top:8px;background:var(--gold-l);border-radius:6px;padding:8px 10px;font-size:.8rem}
.mov .acc{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mov input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--sage)}
.badge{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;display:inline-block}
.b-por{background:var(--gold-l);color:#7a6206}.b-ver{background:var(--sage-l);color:var(--sage)}
.b-obs{background:var(--terra-l);color:var(--terra)}.b-anu{background:var(--cream2);color:var(--muted);text-decoration:line-through}
.vacio{text-align:center;color:var(--muted);padding:28px 10px;font-size:.9rem}
.totales{display:flex;gap:8px;margin-bottom:12px}
.totales div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
.totales b{display:block;font-family:'DM Mono',monospace;font-size:.95rem;margin-top:3px}
.barra-acc{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.esq{height:60px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,var(--cream2) 0%,#f5f1e9 50%,var(--cream2) 100%);background-size:200% 100%;animation:brillo 1.2s infinite}
@keyframes brillo{to{background-position:-200% 0}}
.prox{max-width:560px;margin:30px auto;text-align:center}
.prox .ico{width:64px;height:64px;border-radius:16px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.prox .ico svg{width:28px;height:28px}
.prox h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.6rem;margin-bottom:8px}
.prox p{color:var(--muted);line-height:1.5}
.modo-edicion{background:var(--gold-l);border-radius:8px;padding:10px 12px;font-size:.85rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg-err{background:var(--red-l);color:var(--red);border-radius:8px;padding:10px 12px;font-size:.85rem;margin-top:12px;white-space:pre-line}
.progreso{font-size:.82rem;color:var(--muted);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:.88rem;z-index:60;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink)}
.login .caja{background:var(--cream);border-radius:16px;padding:30px 26px;width:100%;max-width:380px}
.login h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:2.1rem}
.login h1 em{color:var(--gold);font-style:italic}

/* Móvil */
@media (max-width:900px){
  aside{transform:translateX(-100%)} body.menu-abierto aside{transform:none}
  .contenido{margin-left:0}
  .hamb{display:block}
  .barra{padding:12px 16px} main{padding:18px 16px 60px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rejilla{grid-template-columns:1fr}
  .saludo{font-size:1.6rem}
}
</style>
</head>
<body>

<!-- ───────── LOGIN ───────── -->
<section id="vLogin" class="login oculto">
  <div class="caja">
    <div class="eti">Sistema de gestión</div>
    <h1>BLÜM <em>OS</em></h1>
    <form id="fLogin" autocomplete="on">
      <label>Usuario</label>
      <input id="lUsuario" autocomplete="username" autocapitalize="none" placeholder="mauro o camilo" required>
      <label>Clave</label>
      <input id="lClave" type="password" autocomplete="current-password" required>
      <button class="btn ancho" id="bLogin">Entrar</button>
      <div id="lErr" class="msg-err oculto"></div>
    </form>
  </div>
</section>

<!-- ───────── APP ───────── -->
<div id="vApp" class="oculto">
  <aside>
    <div class="marca">BLÜM <em>OS</em><small>BLÜM Group</small></div>
    <nav class="menu" id="menu"></nav>
    <div class="perfil">
      <div class="avatar" id="uAvatar"></div>
      <div><div class="n" id="uNombre"></div><div class="r" id="uRol"></div></div>
      <button id="bSalir">Salir</button>
    </div>
  </aside>
  <div class="velo oculto" id="velo"></div>

  <div class="contenido">
    <header class="barra">
      <button class="hamb" id="bHamb" aria-label="Menú"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="tModulo">Panel de control</h1>
      <div class="acc"><button class="btn chico" id="bNuevoTop">＋ Nuevo movimiento</button></div>
    </header>

    <main>
      <!-- PANEL -->
      <section id="m-panel">
        <div class="saludo" id="pSaludo"></div>
        <div class="fecha" id="pFecha"></div>
        <div class="kpis" id="pKpis"></div>
        <div class="rejilla">
          <div class="card"><h3>Este mes por negocio <span class="eti" id="pPer"></span></h3><div id="pNeg"></div></div>
          <div class="card"><h3>Servicios por vencer <span class="eti">7 días</span></h3><div id="pServ"></div></div>
        </div>
        <div class="card"><h3>Últimos movimientos <button class="btn sec chico" data-ir="movimientos">Ver todos</button></h3><div id="pUlt"></div></div>
      </section>

      <!-- BANDEJA -->
      <section id="m-bandeja" class="oculto">
        <div class="barra-acc" id="bAccBandeja">
          <label style="margin:0;display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="bTodos" style="width:20px;height:20px"> Seleccionar todos</label>
          <button class="btn verde chico" id="bVerificar" type="button">Verificar seleccionados</button>
        </div>
        <div id="bMovs"></div>
      </section>

      <!-- MOVIMIENTOS -->
      <section id="m-movimientos" class="oculto">
        <div class="pestanas" id="tabMov">
          <button data-t="nuevo" class="on">Nuevo</button>
          <button data-t="historial">Historial</button>
        </div>

        <div id="movNuevo" class="angosto">
          <div id="avisoEdicion" class="modo-edicion oculto">
            <span>Corrigiendo <b id="edId"></b></span>
            <button class="btn sec chico" id="bCancelarEd" type="button">Cancelar</button>
          </div>
          <form id="fMov" novalidate>
            <div class="card bloque">
              <label style="margin-top:0">Negocio</label>
              <div class="seg" id="sNegocio"></div>
              <div class="fila">
                <div><label>Tipo</label><select id="mTipo"></select></div>
                <div><label>Fecha</label><input id="mFecha" type="date"></div>
              </div>
              <div id="wCategoria"><label>Categoría</label><select id="mCategoria"></select></div>
              <label id="lAsociado">Propiedad</label>
              <select id="mAsociado"></select>
              <input id="mAsociadoOtro" class="oculto" placeholder="¿Quién o qué?" style="margin-top:8px">
              <div id="wCanal" class="oculto"><label>Canal</label><select id="mCanal"></select></div>
              <div id="wCargo"><label>¿Quién asume el gasto?</label><div class="seg" id="sCargo"></div></div>
            </div>
            <div class="card bloque">
              <div class="fila">
                <div style="flex:1.4"><label style="margin-top:0">Valor</label><input id="mValor" class="valor" inputmode="numeric" placeholder="$0"></div>
                <div><label style="margin-top:0">Cuenta</label><select id="mCuenta"></select></div>
              </div>
              <label>Detalle <span class="h">opcional</span></label>
              <textarea id="mDetalle" placeholder="Qué se pagó o cobró"></textarea>
              <div id="wTrabajo" class="oculto">
                <label>Trabajo <span class="h">agrupa anticipo y pago final de un mismo mantenimiento</span></label>
                <input id="mTrabajo" placeholder="ej. Aires acondicionados sep">
              </div>
            </div>
            <div class="card bloque">
              <label style="margin-top:0">Evidencias <span class="h" id="hEvid">opcional · hasta 10</span></label>
              <div class="drop" id="dropEvid">📎 Adjuntar fotos, videos o documentos</div>
              <input id="mArchivos" type="file" multiple accept="image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx" class="oculto">
              <div class="archivos" id="lArchivos"></div>
            </div>
            <button class="btn ancho" id="bGuardar">Guardar movimiento</button>
            <div id="mProg" class="progreso oculto"></div>
            <div id="mErr" class="msg-err oculto"></div>
          </form>
        </div>

        <div id="movHistorial" class="oculto">
          <div class="fila" style="margin-bottom:12px;max-width:520px">
            <input id="lPeriodo" type="month">
            <select id="lQuien"><option value="mios">Solo míos</option><option value="todos">Todos</option></select>
          </div>
          <div class="totales" id="lTot"></div>
          <div id="lMovs"></div>
        </div>
      </section>

      <!-- RESERVAS -->
      <section id="m-reservas" class="oculto">
        <div class="pestanas" id="tabRes">
          <button data-t="lista" class="on">Reservas del mes</button>
          <button data-t="directa">Nueva reserva directa</button>
        </div>
        <div id="resLista">
          <div style="max-width:220px;margin-bottom:12px"><input id="rPeriodo" type="month"></div>
          <div class="card"><div id="rTabla"></div></div>
        </div>
        <div id="resDirecta" class="angosto oculto">
          <form id="fRes" novalidate>
            <div class="card bloque">
              <label style="margin-top:0">Propiedad</label>
              <select id="rProp"></select>
              <div class="fila">
                <div style="flex:2"><label>Huésped</label><input id="rHuesped" placeholder="Nombre"></div>
                <div><label>Personas</label><input id="rPersonas" type="number" min="1" inputmode="numeric"></div>
              </div>
              <div class="fila">
                <div><label>Check-in</label><input id="rIn" type="date"></div>
                <div><label>Check-out</label><input id="rOut" type="date"></div>
              </div>
              <div class="eti" id="rNoches" style="margin-top:8px"></div>
            </div>
            <div class="card bloque">
              <div class="fila">
                <div><label style="margin-top:0">Valor noches</label><input id="rTarifa" class="valor" inputmode="numeric" placeholder="$0"></div>
                <div><label style="margin-top:0">Aseo</label><input id="rAseo" class="valor" inputmode="numeric" placeholder="$0"></div>
              </div>
              <label style="display:flex;align-items:center;gap:10px;font-weight:500"><input id="rPagado" type="checkbox" style="width:20px;height:20px"> Ya se recibió el pago</label>
              <div id="wPago" class="fila oculto">
                <div><label>Fecha del pago</label><input id="rFechaPago" type="date"></div>
                <div><label>Cuenta</label><select id="rCuenta"></select></div>
              </div>
            </div>
            <button class="btn ancho" id="bRes">Guardar reserva</button>
            <div id="rErr" class="msg-err oculto"></div>
          </form>
        </div>
      </section>

      <!-- PRÓXIMAMENTE -->
      <section id="m-prox" class="oculto">
        <div class="prox">
          <div class="ico" id="xIco"></div>
          <div class="eti" id="xFase"></div>
          <h2 id="xTitulo"></h2>
          <p id="xDesc"></p>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
/* ═════════ CONFIGURACIÓN ═════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwt5x81bCGOct0KiRp6FHATvAnsmUTyyYwYmK-PYe9TIb8PcGbU_aDkLLci7bDTX8SX/exec';
/* ═════════════════════════════════ */

const ICON = {
  panel:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  bandeja:'<path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/>',
  mov:'<path d="M7 7h11l-3-3"/><path d="M17 17H6l3 3"/>',

function ic(n){ return '<svg class="ic" viewBox="0 0 24 24">'+(ICON[n]||'')+'</svg>'; }

/* Módulos: id, sección, nombre, icono, fase si aún no existe, quién lo ve */
const MODULOS = [
  { id:'panel', sec:'General', t:'Panel de control', i:'panel', todos:true },
  { id:'bandeja', sec:'General', t:'Bandeja', i:'bandeja', todos:true },
  { id:'movimientos', sec:'Operación', t:'Movimientos', i:'mov', todos:true },
  { id:'reservas', sec:'Operación', t:'Reservas', i:'reservas', todos:true },
  { id:'servicios', sec:'Operación', t:'Servicios', i:'servicios', fase:'Fase 2', d:'Vencimientos de energía, agua, gas, internet y administración de cada propiedad, con aviso antes del día límite y registro del pago.' },
  { id:'propiedades', sec:'Directorio', t:'Propiedades', i:'casa', fase:'Fase 2', d:'Ficha de cada propiedad: propietario, modalidades, contrato vigente, anuncios de Airbnb y servicios. Editable desde aquí, sin entrar al Sheet.' },
  { id:'propietarios', sec:'Directorio', t:'Propietarios', i:'personas', fase:'Fase 2', d:'Directorio de propietarios con correos, teléfonos y autorización de WhatsApp, y el envío de acceso a su portal.' },
  { id:'contratos', sec:'Directorio', t:'Contratos', i:'contrato', fase:'Fase 2', d:'Condiciones negociadas por propiedad y cliente, con su vigencia: comisión, base, modelo de aseo, IVA y 4x1000.' },

  { id:'caja', sec:'Finanzas', t:'Caja y tarjetas', i:'caja', fase:'Fase 4', d:'Saldo NU, deuda TC NU, pendiente por transferir a Mauro y Caja libre de BLÜM. Confirmación de los Pagos Airbnb contra el banco.' },
  { id:'liquidaciones', sec:'Finanzas', t:'Liquidaciones', i:'liquida', fase:'Fase 5', d:'Cierre mensual por propietario, saldo acumulado, pagos y depósitos, y envío del reporte con previsualización.' },
  { id:'pyg', sec:'Finanzas', t:'P&G', i:'pyg', fase:'Fase 4', d:'Estado de resultados por negocio (Inmobiliaria por canal, Consultoría) y consolidado, mes a mes.' },
  { id:'honorarios', sec:'Finanzas', t:'Honorarios', i:'honor', fase:'Fase 4', d:'Pagos al equipo por persona, mes y negocio.' },

  { id:'marketing', sec:'Estrategia', t:'Marketing', i:'mkt', fase:'Siguiente etapa', d:'Inversión en pauta, origen de reservas y clientes, y retorno por canal.' },

const VISTA = { panel:'m-panel', bandeja:'m-bandeja', movimientos:'m-movimientos', reservas:'m-reservas' };

const LS = { tok:'blumos_tok', ses:'blumos_ses', cat:'blumos_cat2', lista:'blumos_lista_', bandeja:'blumos_bandeja', panel:'blumos_panel', res:'blumos_res_' };
const MAX_ARCH = 10, IMG_MAX = 1600, IMG_CAL = 0.72;
const ETIQUETAS = ['Antes','Después','Factura','Otro'];

let token = lsGet(LS.tok);
let sesion = JSON.parse(lsGet(LS.ses) || 'null');
let cat = JSON.parse(lsGet(LS.cat) || 'null');
let estado = { negocio:'Inmobiliaria', cargo:'', archivos:[], idem:nuevoId(), edicion:null, modulo:'panel' };

/* ───── utilidades ───── */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function $(id){ return document.getElementById(id); }
function nuevoId(){ return (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[-.]/g,''); }
function cop(n){ return '$' + Math.round(Number(n)||0).toLocaleString('es-CO'); }
function numero(s){ return Number(String(s||'').replace(/[^\d]/g,'')) || 0; }
function hoy(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function opciones(sel, items, valor){
  sel.innerHTML = items.map(o => {
    const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
    return '<option value="'+esc(v)+'"'+(v===valor?' selected':'')+'>'+esc(t)+'</option>';
  }).join('');
}
function toast(txt, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=txt; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2600); }
function mostrarErr(id, msg){ const e=$(id); if(!msg){ e.classList.add('oculto'); return; } e.textContent=msg; e.classList.remove('oculto'); }
function formatearValor(inp){ inp.addEventListener('input', () => { const n=numero(inp.value); inp.value = n ? cop(n) : ''; }); }
function esqueleto(n){ return Array.from({length:n}, () => '<div class="esq"></div>').join(''); }
function esAdmin(){ return sesion && sesion.rol === 'Admin'; }

async function api(accion, datos){
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ accion, token, datos }) });
  const j = await r.json();
  if (j.sesion === false) { cerrarSesion(); throw new Error(j.error || 'Sesión vencida'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}

/* ───── sesión ───── */
function cerrarSesion(){
  if (token) fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ accion:'logout', token }) }).catch(()=>{});
  token = null; sesion = null; lsDel(LS.tok); lsDel(LS.ses); lsDel(LS.panel); lsDel(LS.bandeja);
  $('vApp').classList.add('oculto'); $('vLogin').classList.remove('oculto');
}
$('fLogin').addEventListener('submit', async ev => {
  ev.preventDefault(); mostrarErr('lErr','');
  const b=$('bLogin'); b.disabled=true; b.textContent='Entrando…';
  try {
    const r = await api('login', { usuario: $('lUsuario').value.trim(), clave: $('lClave').value });
    token=r.token; sesion=r.sesion; lsSet(LS.tok, token); lsSet(LS.ses, JSON.stringify(sesion)); $('lClave').value='';
    iniciarApp();
  } catch(e){ mostrarErr('lErr', e.message); }
  finally { b.disabled=false; b.textContent='Entrar'; }
});
$('bSalir').addEventListener('click', cerrarSesion);

/* ───── menú ───── */
function modulosVisibles(){ return MODULOS.filter(m => m.todos || esAdmin()); }
function pintarMenu(){
  let html = '', sec = '';
  modulosVisibles().forEach(m => {
    if (m.sec !== sec) { sec = m.sec; html += '<div class="sec">'+sec+'</div>'; }
    html += '<button class="item'+(estado.modulo===m.id?' on':'')+'" data-m="'+m.id+'">'+ic(m.i)+'<span>'+m.t+'</span>' +
      (m.id==='bandeja' ? '<span class="num oculto" id="nBandeja"></span>' : (m.fase ? '<span class="pr">Pronto</span>' : '')) + '</button>';
  });
  $('menu').innerHTML = html;
  $('menu').querySelectorAll('.item').forEach(b => b.onclick = () => ir(b.dataset.m));
}
function abrirMenu(si){ document.body.classList.toggle('menu-abierto', si); $('velo').classList.toggle('oculto', !si); }
$('bHamb').onclick = () => abrirMenu(true);
$('velo').onclick = () => abrirMenu(false);

function ir(id, sub){
  const m = MODULOS.find(x => x.id === id) || MODULOS[0];
  if (!m.todos && !esAdmin()) return ir('panel');
  estado.modulo = m.id;
  document.querySelectorAll('main > section').forEach(s => s.classList.add('oculto'));
  $(VISTA[m.id] || 'm-prox').classList.remove('oculto');
  $('tModulo').textContent = m.t;
  document.querySelectorAll('#menu .item').forEach(b => b.classList.toggle('on', b.dataset.m === m.id));
  abrirMenu(false); window.scrollTo(0,0);
  if (location.hash !== '#'+m.id) history.replaceState(null, '', '#'+m.id);
  if (!VISTA[m.id]) { $('xIco').innerHTML=ic(m.i); $('xFase').textContent='Próximamente · '+m.fase; $('xTitulo').textContent=m.t; $('xDesc').textContent=m.d; return; }
  if (m.id==='panel') cargarPanel();
  if (m.id==='bandeja') cargarBandeja();
  if (m.id==='movimientos') pestana('tabMov', sub || (estado.edicion ? 'nuevo' : null));
  if (m.id==='reservas') pestana('tabRes', sub);
}
function pestana(grupo, t){
  const cont = $(grupo); const btns = cont.querySelectorAll('button');
  if (!t) t = (cont.querySelector('button.on') || btns[0]).dataset.t;
  btns.forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (grupo==='tabMov') { $('movNuevo').classList.toggle('oculto', t!=='nuevo'); $('movHistorial').classList.toggle('oculto', t!=='historial'); if (t==='historial') cargarLista(); }
  if (grupo==='tabRes') { $('resLista').classList.toggle('oculto', t!=='lista'); $('resDirecta').classList.toggle('oculto', t!=='directa'); if (t==='lista') cargarReservas(); }
}
$('tabMov').querySelectorAll('button').forEach(b => b.onclick = () => pestana('tabMov', b.dataset.t));
$('tabRes').querySelectorAll('button').forEach(b => b.onclick = () => pestana('tabRes', b.dataset.t));
$('bNuevoTop').onclick = () => ir('movimientos', 'nuevo');
document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir, 'historial'));

/* ───── arranque ───── */
function iniciarApp(){
  $('vLogin').classList.add('oculto'); $('vApp').classList.remove('oculto');
  $('uNombre').textContent = sesion.nombre; $('uRol').textContent = sesion.rol === 'Admin' ? 'Administrador' : 'Registro';
  $('uAvatar').textContent = sesion.nombre.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  pintarMenu();
  if (cat) pintarCatalogo();
  ir((location.hash||'').slice(1) || 'panel');
  api('catalogo').then(r => { cat=r.catalogo; lsSet(LS.cat, JSON.stringify(cat)); pintarCatalogo(); }).catch(e => toast(e.message, true));
  cargarBandeja(true);
}

/* ───── panel ───── */
async function cargarPanel(){
  const h = new Date().getHours();
  $('pSaludo').innerHTML = (h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches') + ', <em>' + esc(sesion.nombre.split(' ')[0]) + '</em>';
  $('pFecha').textContent = new Date().toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const previo = JSON.parse(lsGet(LS.panel) || 'null');
  if (previo) pintarPanel(previo); else { $('pKpis').innerHTML = esqueleto(1); $('pNeg').innerHTML=esqueleto(2); $('pServ').innerHTML=esqueleto(2); $('pUlt').innerHTML=esqueleto(3); }
  try { const r = await api('panel'); lsSet(LS.panel, JSON.stringify(r)); pintarPanel(r); } catch(e){ toast(e.message, true); }
}
function pintarPanel(r){
  const k = [
    { t: r.admin ? 'Por verificar' : 'Mis registros por verificar', v: r.porVerificar, h:'Pendientes de Mauro', ir:'bandeja' },
    { t:'Observados', v:r.observados, h:'Para corregir', ir:'bandeja' },
    { t: r.admin ? 'Registros del mes' : 'Mis registros del mes', v:r.registrosMes, h:'Sin anulados', ir:'movimientos' },
    { t:'Reservas del mes', v:r.reservasMes, h:r.nochesMes + ' noches', ir:'reservas' }
  ];
  $('pKpis').innerHTML = k.map(x => '<div class="kpi link" data-ir="'+x.ir+'"><div class="eti">'+x.t+'</div><div class="v">'+x.v+'</div><div class="h">'+x.h+'</div></div>').join('');
  $('pKpis').querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
  $('pPer').textContent = r.periodo;
  const negs = Object.keys(r.porNegocio || {});
  $('pNeg').innerHTML = negs.length ? '<table class="tabla"><tr><th>Negocio</th><th class="num-r">Entradas</th><th class="num-r">Salidas</th><th class="num-r">Neto</th></tr>' +
    negs.map(n => { const x=r.porNegocio[n]; const neto=x.entradas-x.salidas; return '<tr><td>'+esc(n)+'</td><td class="num-r verde">'+cop(x.entradas)+'</td><td class="num-r terra">'+cop(x.salidas)+'</td><td class="num-r '+(neto<0?'terra':'')+'">'+cop(neto)+'</td></tr>'; }).join('') + '</table>' +
    (r.admin ? '<div class="eti" style="margin-top:10px">Caja libre y saldos de propietarios: módulo Caja y tarjetas (Fase 4)</div>' : '')
    : '<div class="vacio">Aún no hay movimientos este mes</div>';
  $('pServ').innerHTML = r.servicios.length ? r.servicios.map(s => '<div class="vence"><div><b>'+esc(s.servicio)+'</b><div class="eti" style="margin-top:2px">'+esc(s.propiedad)+' · día '+s.dia+(s.valor?' · '+cop(s.valor):'')+'</div></div><span class="dias'+(s.faltan===0?' hoy':'')+'">'+(s.faltan===0?'Hoy':s.faltan===1?'Mañana':'En '+s.faltan+' días')+'</span></div>').join('') : '<div class="vacio">Nada vence esta semana</div>';
  $('pUlt').innerHTML = r.ultimos.length ? r.ultimos.map(m => tarjetaMov(m)).join('') : '<div class="vacio">Sin movimientos</div>';
}

/* ───── catálogo y formulario ───── */
function pintarCatalogo(){
  $('sNegocio').innerHTML = cat.negocios.map(n => '<button type="button" data-v="'+esc(n)+'" class="'+(n===estado.negocio?'on':'')+'">'+esc(n)+'</button>').join('');
  $('sNegocio').querySelectorAll('button').forEach(b => b.onclick = () => { estado.negocio=b.dataset.v; estado.cargo=''; pintarCatalogo(); });
  const tipoAct = $('mTipo').value || 'Egreso';
  opciones($('mTipo'), cat.tipos, cat.tipos.indexOf(tipoAct) >= 0 ? tipoAct : 'Egreso');
  if (!$('mFecha').value) $('mFecha').value = hoy();
  opciones($('mCuenta'), cat.cuentas.map(c => c.cuenta), $('mCuenta').value || 'NU');
  opciones($('rCuenta'), cat.cuentas.filter(c => c.tipo === 'Caja').map(c => c.cuenta), 'NU');
  opciones($('rProp'), [{v:'',t:'Selecciona…'}].concat(cat.propiedades.filter(p => String(p.modalidades||'').indexOf('Renta corta')>=0).map(p => ({ v:p.id, t:p.nombre }))), $('rProp').value);
  actualizarFormulario();
}
function catActual(){ return cat.categorias.find(x => x.negocio===estado.negocio && x.tipo===$('mTipo').value && x.categoria===$('mCategoria').value); }

function actualizarFormulario(){
  if (!cat) return;
  const neg = estado.negocio, tipo = $('mTipo').value;
  const conCat = tipo==='Ingreso' || tipo==='Egreso';
  $('wCategoria').classList.toggle('oculto', !conCat);
  if (conCat) {
    const cats = cat.categorias.filter(c => c.negocio===neg && c.tipo===tipo);
    const actual = $('mCategoria').value;
    opciones($('mCategoria'), [{v:'',t:'Selecciona…'}].concat(cats.map(c => c.categoria)), cats.some(c => c.categoria===actual) ? actual : '');
  }
  let lbl='Propiedad', items=[];
  const props = cat.propiedades.map(p => ({ v:p.id, t:p.nombre + (p.propietario ? ' · '+p.propietario : '') }));
  if (tipo==='Pago tarjeta') { lbl='Tarjeta que se paga'; items = cat.cuentas.filter(c => c.tipo!=='Caja').map(c => c.cuenta); }
  else if (['Pago a propietario','Depósito propietario','Pago Airbnb'].indexOf(tipo)>=0) { items = props; }
  else if (neg==='Inmobiliaria') { items = props.concat([{ v:'General Inmobiliaria', t:'General Inmobiliaria (varias o ninguna)' }]); }
  else if (neg==='Consultoría') { lbl='Cliente'; items = cat.clientes.map(c => ({ v:c.id, t:c.nombre })).concat([{ v:'General Consultoría', t:'General Consultoría' }]); }
  else { lbl='Asociado a'; items = ['BLÜM general'].concat(cat.personas); }
  items = [{v:'',t:'Selecciona…'}].concat(items).concat(neg!=='Inmobiliaria' && tipo!=='Pago tarjeta' ? [{ v:'__otro', t:'Otro…' }] : []);
  $('lAsociado').textContent = lbl;
  const prev = $('mAsociado').value;
  opciones($('mAsociado'), items, items.some(o => (typeof o==='object'?o.v:o)===prev) ? prev : '');
  $('mAsociadoOtro').classList.toggle('oculto', $('mAsociado').value!=='__otro');

  // canal
  const p = cat.propiedades.find(x => x.id===$('mAsociado').value);
  const mods = p ? String(p.modalidades||'').split('+').map(x=>x.trim()).filter(Boolean) : [];
  const verCanal = neg==='Inmobiliaria' && mods.length > 1;
  $('wCanal').classList.toggle('oculto', !verCanal);
  if (verCanal) { const pc=$('mCanal').value; opciones($('mCanal'), [{v:'',t:'Selecciona…'}].concat(mods), mods.indexOf(pc)>=0?pc:''); }

  // quién asume
  const conCargo = neg==='Inmobiliaria' && tipo==='Egreso';
  $('wCargo').classList.toggle('oculto', !conCargo);
  if (conCargo) {
    const c = catActual();
    if (!estado.cargo && c && c.cargo) estado.cargo = c.cargo;
    $('sCargo').innerHTML = ['Propietario','BLÜM'].map(v => '<button type="button" data-v="'+v+'" class="'+(estado.cargo===v?'on':'')+'">'+v+'</button>').join('');
    $('sCargo').querySelectorAll('button').forEach(b => b.onclick = () => { estado.cargo=b.dataset.v; actualizarFormulario(); });
  }
  if (!conCat && !$('mCuenta').dataset.tocada) $('mCuenta').value = 'NU';

  const c = conCat ? catActual() : null;
  const exige = !!(c && c.evidencia);
  $('dropEvid').classList.toggle('req', exige && !estado.archivos.length);
  $('hEvid').textContent = exige ? 'obligatoria para esta categoría · hasta 10' : 'opcional · hasta 10';
  $('wTrabajo').classList.toggle('oculto', !(c && c.reporte));
}
$('mTipo').addEventListener('change', () => { estado.cargo=''; actualizarFormulario(); });
$('mCategoria').addEventListener('change', () => { estado.cargo=''; actualizarFormulario(); });
$('mAsociado').addEventListener('change', actualizarFormulario);
$('mCuenta').addEventListener('change', e => e.target.dataset.tocada='1');
formatearValor($('mValor')); formatearValor($('rTarifa')); formatearValor($('rAseo'));

/* evidencias */
$('dropEvid').onclick = () => $('mArchivos').click();
$('mArchivos').addEventListener('change', e => {
  for (const f of Array.from(e.target.files||[])) {
    if (estado.archivos.length >= MAX_ARCH) { toast('Máximo '+MAX_ARCH+' archivos', true); break; }
    estado.archivos.push({ file:f, etiqueta: f.type.indexOf('image/')===0 ? 'Después' : (f.type==='application/pdf' ? 'Factura' : 'Otro'), url: f.type.indexOf('image/')===0 ? URL.createObjectURL(f) : '' });
  }
  e.target.value=''; pintarArchivos(); actualizarFormulario();
});
function pintarArchivos(){
  $('lArchivos').innerHTML = estado.archivos.map((a,i) =>
    '<div class="arch">'+(a.url?'<img src="'+a.url+'" alt="">':'<div class="ico">'+(a.file.type.indexOf('video/')===0?'VIDEO':'DOC')+'</div>')+
    '<div class="nom">'+esc(a.file.name)+'<br><span class="eti">'+(a.file.size/1048576).toFixed(1)+' MB</span></div>'+
    '<select data-i="'+i+'">'+ETIQUETAS.map(t=>'<option'+(t===a.etiqueta?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<button type="button" class="x" data-x="'+i+'">✕</button></div>').join('');
  $('lArchivos').querySelectorAll('select').forEach(s => s.onchange = () => estado.archivos[s.dataset.i].etiqueta = s.value);
  $('lArchivos').querySelectorAll('.x').forEach(b => b.onclick = () => { estado.archivos.splice(Number(b.dataset.x),1); pintarArchivos(); actualizarFormulario(); });
}
function comprimir(file){
  return new Promise(resolve => {
    if (file.type.indexOf('image/')!==0 || file.type==='image/gif') return resolve(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, IMG_MAX/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => resolve(b && b.size<file.size ? new File([b], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file), 'image/jpeg', IMG_CAL);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}
function aBase64(file){ return new Promise((ok,fail) => { const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=fail; r.readAsDataURL(file); }); }

function datosMovimiento(){
  const asoc = $('mAsociado').value==='__otro' ? $('mAsociadoOtro').value.trim() : $('mAsociado').value;
  return {
    fecha:$('mFecha').value, negocio:estado.negocio, tipo:$('mTipo').value,
    categoria: $('wCategoria').classList.contains('oculto') ? '' : $('mCategoria').value,
    asociado_a:asoc, canal: $('wCanal').classList.contains('oculto') ? '' : $('mCanal').value,
    cargo_de: $('wCargo').classList.contains('oculto') ? '' : estado.cargo,
    valor:numero($('mValor').value), cuenta:$('mCuenta').value, detalle:$('mDetalle').value, trabajo:$('mTrabajo').value
  };
}
function validarLocal(d){
  const e=[];
  if (!d.fecha) e.push('Fecha');
  if ((d.tipo==='Ingreso'||d.tipo==='Egreso') && !d.categoria) e.push('Categoría');
  if (!d.asociado_a) e.push($('lAsociado').textContent);
  if (!$('wCanal').classList.contains('oculto') && !d.canal) e.push('Canal');
  if (!$('wCargo').classList.contains('oculto') && !d.cargo_de) e.push('Quién asume el gasto');
  if (!(d.valor>0)) e.push('Valor');
  const c = catActual();
  if (c && c.evidencia && !estado.archivos.length && !estado.edicion) e.push('Evidencia (obligatoria en '+d.categoria+')');
  return e.length ? 'Falta: '+e.join(', ') : '';
}
$('fMov').addEventListener('submit', async ev => {
  ev.preventDefault(); mostrarErr('mErr','');
  const d = datosMovimiento(); const falta = validarLocal(d);
  if (falta) return mostrarErr('mErr', falta);
  const b=$('bGuardar'); b.disabled=true; const prog=$('mProg'); prog.classList.remove('oculto');
  try {
    const evidencias=[];
    for (let i=0;i<estado.archivos.length;i++){
      const a=estado.archivos[i];
      if (a.subido) { evidencias.push(a.subido); continue; }
      prog.textContent='Subiendo evidencia '+(i+1)+' de '+estado.archivos.length+'…';
      const f = await comprimir(a.file);
      const r = await api('subirArchivo', { nombre:f.name, mime:f.type, base64: await aBase64(f), asociado_a:d.asociado_a, negocio:d.negocio, fecha:d.fecha, categoria:d.categoria, etiqueta:a.etiqueta });
      a.subido = { fileId:r.fileId, nombre:r.nombre, tipo:r.tipo, etiqueta:a.etiqueta }; evidencias.push(a.subido);
    }
    prog.textContent='Guardando…';
    if (estado.edicion) { await api('corregir', Object.assign(d, { id:estado.edicion, evidencias })); toast('Corrección enviada a verificación ✓'); salirEdicion(); }
    else { const r = await api('registrarMovimiento', Object.assign(d, { evidencias, idem_key:estado.idem })); toast(r.repetido ? 'Ya estaba registrado ('+r.id+')' : 'Movimiento registrado ✓'); }
    limpiarMovimiento(); lsDel(LS.panel); cargarBandeja(true);
  } catch(e){ mostrarErr('mErr', e.message); }
  finally { b.disabled=false; prog.classList.add('oculto'); }
});
function limpiarMovimiento(){
  $('mValor').value=''; $('mDetalle').value=''; $('mTrabajo').value=''; $('mAsociadoOtro').value='';
  estado.archivos=[]; estado.cargo=''; estado.idem=nuevoId(); delete $('mCuenta').dataset.tocada;
  pintarArchivos(); actualizarFormulario();
}
function entrarEdicion(m){
  estado.edicion=m.id; estado.negocio = cat.negocios.indexOf(m.negocio)>=0 ? m.negocio : cat.negocios[0]; estado.cargo=m.cargo_de||'';
  $('edId').textContent=m.id; $('avisoEdicion').classList.remove('oculto'); $('bGuardar').textContent='Enviar corrección';
  ir('movimientos','nuevo'); pintarCatalogo();
  $('mTipo').value=m.tipo; actualizarFormulario();
  $('mCategoria').value=m.categoria; $('mFecha').value=m.fecha; actualizarFormulario();
  if (!Array.from($('mAsociado').options).some(o => o.value===m.asociado_a)) { $('mAsociado').value='__otro'; $('mAsociadoOtro').value=m.asociado_a; } else $('mAsociado').value=m.asociado_a;
  actualizarFormulario(); if (m.canal) $('mCanal').value=m.canal;
  $('mValor').value=cop(m.valor); $('mCuenta').value=m.cuenta; $('mCuenta').dataset.tocada='1';
  $('mDetalle').value=m.detalle||''; $('mTrabajo').value=m.trabajo||''; actualizarFormulario();
}
function salirEdicion(){ estado.edicion=null; $('avisoEdicion').classList.add('oculto'); $('bGuardar').textContent='Guardar movimiento'; }
$('bCancelarEd').onclick = () => { salirEdicion(); limpiarMovimiento(); };

/* ───── listas ───── */
function badge(e){ const c={'Por verificar':'b-por','Verificado':'b-ver','Observado':'b-obs','Anulado':'b-anu'}[e]||'b-por'; return '<span class="badge '+c+'">'+esc(e)+'</span>'; }
function esEntrada(t){ return t==='Ingreso' || t==='Depósito propietario' || t==='Pago Airbnb'; }
function tarjetaMov(m, o){
  o = o || {};
  return '<div class="mov">'+(o.check?'<input type="checkbox" data-id="'+esc(m.id)+'">':'')+
    '<div class="cuerpo"><div class="t1"><span>'+esc(m.categoria||m.tipo)+'</span><span class="monto '+(esEntrada(m.tipo)?'in':'out')+'">'+(esEntrada(m.tipo)?'+':'−')+cop(m.valor)+'</span></div>'+
    '<div class="t2">'+esc(m.asociado_nombre)+' · '+esc(m.fecha)+' · '+esc(m.cuenta)+(m.cargo_de?' · cargo '+esc(m.cargo_de):'')+'</div>'+
    '<div class="t2">'+badge(m.estado)+' '+esc(m.negocio)+(m.canal?' · '+esc(m.canal):'')+' · '+esc(m.registrado_por)+(m.detalle?' · '+esc(m.detalle):'')+'</div>'+
    (m.observacion && m.estado!=='Verificado' ? '<div class="obs"><b>'+(m.estado==='Anulado'?'Motivo':'Corregir')+':</b> '+esc(m.observacion)+'</div>' : '')+
    (o.acciones ? '<div class="acc">'+o.acciones+'</div>' : '')+'</div></div>';
}
function puedeCorregir(m){ if (m.estado==='Anulado') return false; if (esAdmin()) return true; return m.registrado_por===sesion.usuario && (m.estado==='Observado'||m.estado==='Por verificar'); }
function ligarCorregir(cont, movs){ cont.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => entrarEdicion(movs.find(m => m.id===b.dataset.ed))); }

async function cargarLista(){
  const per = $('lPeriodo').value || hoy().slice(0,7); $('lPeriodo').value = per;
  const quien = $('lQuien').value, k = LS.lista+per+quien;
  const previo = JSON.parse(lsGet(k)||'null');
  if (previo) pintarLista(previo); else { $('lMovs').innerHTML=esqueleto(4); $('lTot').innerHTML=''; }
  try { const r = await api('listarMovimientos', { periodo:per, soloMios: quien==='mios' }); lsSet(k, JSON.stringify(r.movimientos)); pintarLista(r.movimientos); } catch(e){ toast(e.message, true); }
}
function pintarLista(movs){
  const vivos = movs.filter(m => m.estado!=='Anulado');
  const ent = vivos.filter(m => esEntrada(m.tipo)).reduce((s,m)=>s+m.valor,0), sal = vivos.filter(m => !esEntrada(m.tipo)).reduce((s,m)=>s+m.valor,0);
  $('lTot').innerHTML = '<div><span class="eti">Entradas</span><b class="verde">'+cop(ent)+'</b></div><div><span class="eti">Salidas</span><b class="terra">'+cop(sal)+'</b></div><div><span class="eti">Registros</span><b>'+movs.length+'</b></div>';
  $('lMovs').innerHTML = movs.length ? movs.map(m => tarjetaMov(m, { acciones: puedeCorregir(m) ? '<button class="btn sec chico" data-ed="'+esc(m.id)+'">Corregir</button>' : '' })).join('') : '<div class="vacio">Sin registros en este mes</div>';
  ligarCorregir($('lMovs'), movs);
}
$('lPeriodo').addEventListener('change', cargarLista); $('lQuien').addEventListener('change', cargarLista);

/* ───── bandeja ───── */
async function cargarBandeja(silencioso){
  const previo = JSON.parse(lsGet(LS.bandeja)||'null');
  if (!silencioso) { if (previo) pintarBandeja(previo); else $('bMovs').innerHTML=esqueleto(4); }
  try { const r = await api('bandeja'); lsSet(LS.bandeja, JSON.stringify(r.movimientos)); pintarBandeja(r.movimientos); } catch(e){ if (!silencioso) toast(e.message, true); }
}
function pintarBandeja(movs){
  const admin=esAdmin(), n=movs.length, nb=$('nBandeja');
  if (nb) { nb.textContent=n; nb.classList.toggle('oculto', !n); }
  $('bAccBandeja').classList.toggle('oculto', !admin || !movs.some(m => m.estado==='Por verificar'));
  $('bMovs').innerHTML = n ? movs.map(m => {
    let acc='';
    if (admin && m.estado==='Por verificar') acc = '<button class="btn sec chico" data-obs="'+esc(m.id)+'">Observar</button><button class="btn rojo chico" data-anu="'+esc(m.id)+'">Anular</button>';
    if (puedeCorregir(m)) acc += '<button class="btn sec chico" data-ed="'+esc(m.id)+'">Corregir</button>';
    return tarjetaMov(m, { check: admin && m.estado==='Por verificar', acciones:acc });
  }).join('') : '<div class="vacio">'+(admin?'Todo verificado ✓':'Nada por corregir ✓')+'</div>';
  ligarCorregir($('bMovs'), movs);
  $('bMovs').querySelectorAll('[data-obs]').forEach(b => b.onclick = async () => { const c=prompt('¿Qué hay que corregir?'); if(!c) return; try { await api('observar',{id:b.dataset.obs, comentario:c}); toast('Enviado a corrección'); cargarBandeja(); } catch(e){ toast(e.message,true); } });
  $('bMovs').querySelectorAll('[data-anu]').forEach(b => b.onclick = async () => { const c=prompt('Motivo de la anulación'); if(!c) return; try { await api('anular',{id:b.dataset.anu, motivo:c}); toast('Movimiento anulado'); cargarBandeja(); } catch(e){ toast(e.message,true); } });
  $('bTodos').checked=false;
}
$('bTodos').addEventListener('change', e => $('bMovs').querySelectorAll('input[type=checkbox]').forEach(c => c.checked=e.target.checked));
$('bVerificar').addEventListener('click', async () => {
  const ids = Array.from($('bMovs').querySelectorAll('input[type=checkbox]:checked')).map(c => c.dataset.id);
  if (!ids.length) return toast('Selecciona al menos uno', true);
  const b=$('bVerificar'); b.disabled=true;
  try { const r = await api('verificar',{ids}); toast(r.verificados+' verificado(s) ✓'); lsDel(LS.panel); cargarBandeja(); } catch(e){ toast(e.message,true); } finally { b.disabled=false; }
});

/* ───── reservas ───── */
async function cargarReservas(){
  const per = $('rPeriodo').value || hoy().slice(0,7); $('rPeriodo').value=per;
  const previo = JSON.parse(lsGet(LS.res+per)||'null');
  if (previo) pintarReservas(previo); else $('rTabla').innerHTML=esqueleto(3);
  try { const r = await api('listarReservas',{periodo:per}); lsSet(LS.res+per, JSON.stringify(r.reservas)); pintarReservas(r.reservas); } catch(e){ toast(e.message,true); }
}
function pintarReservas(rs){
  $('rTabla').innerHTML = rs.length ? '<table class="tabla"><tr><th>Propiedad</th><th>Huésped</th><th>Fechas</th><th class="num-r">Noches</th><th>Canal</th><th class="num-r">Neto</th></tr>'+
    rs.map(r => '<tr><td>'+esc(r.propiedad)+'</td><td>'+esc(r.huesped)+'</td><td>'+esc(r.checkin.slice(5))+' → '+esc(r.checkout.slice(5))+'</td><td class="num-r">'+r.noches+'</td><td>'+esc(r.plataforma)+(r.estado_reserva==='Cancelada'?' · cancelada':'')+'</td><td class="num-r">'+cop(r.neto)+'</td></tr>').join('')+'</table>'
    + '<div class="eti" style="margin-top:10px">Las reservas de Airbnb llegan solas desde la Fase 3</div>'
    : '<div class="vacio">Sin reservas en este mes. Las de Airbnb llegarán solas con la Fase 3.</div>';
}
$('rPeriodo').addEventListener('change', cargarReservas);
function calcNoches(){ const a=$('rIn').value, b=$('rOut').value; const n = a&&b ? Math.round((new Date(b)-new Date(a))/86400000) : 0; $('rNoches').textContent = n>0 ? n+' noche'+(n>1?'s':'') : ''; return n; }
$('rIn').addEventListener('change', calcNoches); $('rOut').addEventListener('change', calcNoches);
$('rPagado').addEventListener('change', e => { $('wPago').classList.toggle('oculto', !e.target.checked); if (!$('rFechaPago').value) $('rFechaPago').value=hoy(); });
let idemRes = nuevoId();
$('fRes').addEventListener('submit', async ev => {
  ev.preventDefault(); mostrarErr('rErr','');
  const d = { propiedad_id:$('rProp').value, huesped:$('rHuesped').value.trim(), personas:$('rPersonas').value, checkin:$('rIn').value, checkout:$('rOut').value,
    tarifa_noches:numero($('rTarifa').value), tarifa_aseo:numero($('rAseo').value), pagado:$('rPagado').checked, fecha_pago:$('rFechaPago').value, cuenta:$('rCuenta').value, idem_key:idemRes };
  const e=[]; if(!d.propiedad_id) e.push('Propiedad'); if(!d.huesped) e.push('Huésped'); if(calcNoches()<1) e.push('Fechas'); if(!d.tarifa_noches) e.push('Valor noches');
  if (e.length) return mostrarErr('rErr','Falta: '+e.join(', '));
  const b=$('bRes'); b.disabled=true; b.textContent='Guardando…';
  try {
    const r = await api('registrarReservaDirecta', d);
    toast('Reserva '+r.codigo+' registrada ✓');
    ['rHuesped','rPersonas','rIn','rOut','rTarifa','rAseo'].forEach(id => $(id).value='');
    $('rPagado').checked=false; $('wPago').classList.add('oculto'); calcNoches(); idemRes=nuevoId(); lsDel(LS.panel);
    pestana('tabRes','lista');
  } catch(e){ mostrarErr('rErr', e.message); }
  finally { b.disabled=false; b.textContent='Guardar reserva'; }
});

/* ───── inicio ───── */
window.addEventListener('hashchange', () => { if (sesion) { const id=(location.hash||'').slice(1); if (id && id!==estado.modulo) ir(id); } });
if (token && sesion) iniciarApp(); else $('vLogin').classList.remove('oculto');
</script>
